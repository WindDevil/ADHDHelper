[package]
name = "adhd_helper"
version = "0.1.0"
description = "A fullscreen reminder app built with Tauri"
authors = ["solo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "adhd_helper_console"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "adhd_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adhd_helper"
path = "src/main.rs"

[[bin]]
name = "adhd_helper_console"
path = "src/main_console.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
